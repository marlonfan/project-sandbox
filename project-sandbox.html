const boardEl = $('#board');
boardEl.addEventListener('dragstart', e => {
  const row = e.target.closest('.prow');
  if (!row) return;
  e.dataTransfer.setData('text/plain', row.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
});
boardEl.addEventListener('dragover', e => {
  const body = e.target.closest('.zone-body');
  if (!body) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  boardEl.querySelectorAll('.zone-body.drag-over').forEach(b => b.classList.remove('drag-over'));
  body.classList.add('drag-over');
});
boardEl.addEventListener('drop', e => {
  const body = e.target.closest('.zone-body');
  if (!body) return;
  e.preventDefault();
  body.classList.remove('drag-over');
  const pid = e.dataTransfer.getData('text/plain');
  const p = state.projects.find(x => x.id === pid);
  if (!p) return;
  const targetGoal = body.dataset.goal;

  const list = state.projects
    .filter(x => x.goalId === targetGoal && x.id !== pid)
    .sort((a,b) => ((Number(a.order)||0) - (Number(b.order)||0)));
  let idx = list.length;
  const overEl = e.target.closest('.pblock');
  const overId = overEl ? overEl.dataset.pid : null;
  if (overId && overId !== pid){
    const overIdx = list.findIndex(x => x.id === overId);
    if (overIdx >= 0){
      const rect = overEl.getBoundingClientRect();
      idx = e.clientY > rect.top + rect.height / 2 ? overIdx + 1 : overIdx;
    }
  }
  list.splice(idx, 0, p);
  const goalChanged = p.goalId !== targetGoal;
  p.goalId = targetGoal;
  p.updatedAt = Date.now();
  list.forEach((x,i) => { x.order = i; });
  save(); renderAll();
  if (goalChanged)   toast('「' + p.name + '」已移动到新目标');
});

/* ================= 本周视图 ================= */
let curView = 'board';
let weekOffset = 0;   // 0 = 本周，-1 = 上周
let wkType = 'all';
try { curView = localStorage.getItem('psb-view') === 'weekly' ? 'weekly' : 'board'; } catch(e){}

function setView(v){
  curView = v;
  try { localStorage.setItem('psb-view', v); } catch(e){}
  renderAll();
}
function toggleViewVisibility(){
  const weekly = curView === 'weekly';
  $('#board').style.display = weekly ? 'none' : '';
  $('#weekly').style.display = weekly ? '' : 'none';
  ['#stats','#search-wrap','#status-filter','#btn-add-goal','#btn-snap'].forEach(sel => {
    $(sel).style.display = weekly ? 'none' : '';
  });
  document.querySelectorAll('#view-switch button').forEach(b => b.classList.toggle('on', b.dataset.view === curView));
}

function weekRange(offset){
  const d = new Date();
  const dow = (d.getDay() + 6) % 7; // 周一 = 0
  const start = new Date(d); start.setHours(0,0,0,0);
  start.setDate(d.getDate() - dow + offset * 7);
  const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23,59,59,999);
  const fmt = t => (t.getMonth()+1) + '月' + t.getDate() + '日';
  return { start: start.getTime(), end: end.getTime(), label: fmt(start) + ' – ' + fmt(end) };
}

/* 从 state 推导某一周的全部变化 / 风险 / 无动静 */
function deriveWeekly(offset){
  const w = weekRange(offset);
  const changes = [];
  state.projects.forEach(p => {
    (p.statusLog || []).forEach(l => {
      if (l.ts >= w.start && l.ts <= w.end && l.from !== l.to)
        changes.push({ ts:l.ts, type:'status', goalId:p.goalId, projectId:p.id, project:p.name, issue:null,
          text:'状态从「' + (STATUS[l.from] ? STATUS[l.from].label : l.from) + '」转为「' + (STATUS[l.to] ? STATUS[l.to].label : l.to) + '」' });
    });
    state.issues.filter(i => i.projectId === p.id).forEach(i => {
      if (i.createdAt >= w.start && i.createdAt <= w.end)
        changes.push({ ts:i.createdAt, type:'add', goalId:p.goalId, projectId:p.id, project:p.name, issue:i.title, issueId:i.id, text:'优先级 ' + SEVERITY[i.severity] });
      if (i.resolvedAt && i.resolvedAt >= w.start && i.resolvedAt <= w.end)
        changes.push({ ts:i.resolvedAt, type:'done', goalId:p.goalId, projectId:p.id, project:p.name, issue:i.title, issueId:i.id, text:'标记完成' });
      (i.notes || []).forEach(n => {
        if (n.ts >= w.start && n.ts <= w.end)
          changes.push({ ts:n.ts, type:'progress', goalId:p.goalId, projectId:p.id, project:p.name, issue:i.title, issueId:i.id, text:n.text });
      });
    });
  });
  changes.sort((a,b) => b.ts - a.ts);

  /* 需要关注：受阻项目 + 逾期项目 */
  const risks = [];
  state.projects.filter(p => p.status === 'blocked').forEach(p => {
    const g = state.goals.find(x => x.id === p.goalId);
    risks.push({ level:'red', tag:'受阻', title:p.name, pid:p.id,
      desc:(g ? g.name : '') + ' · 受阻中。可以直接改为进行中解除标记，或去沙盘里更新实际进展。' });
  });
  state.projects.filter(p => isOverdue(p)).forEach(p => {
    const days = Math.floor((Date.now() - new Date(p.deadline + 'T23:59:59').getTime()) / DAY);
    const g = state.goals.find(x => x.id === p.goalId);
    risks.push({ level:'amber', tag:'逾期 ' + days + ' 天', title:p.name, pid:p.id,
      desc:(g ? g.name : '') + ' · 原定 ' + fmtDeadline(p.deadline) + ' 完成且尚未结束。可顺延一周，或确认实际状态。' });
  });

  /* 无动静：本周零活动且未完成的项目 */
  const now = Date.now();
  const quiet = state.projects.filter(p => p.status !== 'done').map(p => {
    let la = p.updatedAt || p.createdAt || 0;
    state.issues.filter(i => i.projectId === p.id).forEach(i => {
      la = Math.max(la, i.createdAt || 0, i.resolvedAt || 0);
      (i.notes || []).forEach(n => { la = Math.max(la, n.ts || 0); });
    });
    return { pid:p.id, name:p.name, goal:(state.goals.find(x => x.id === p.goalId) || {}).name || '', la,
      days: Math.max(0, Math.floor((now - la) / DAY)) };
  }).filter(q => q.la < w.start).sort((a,b) => b.days - a.days);

  const counts = { done:0, add:0, progress:0, status:0 };
  changes.forEach(c => counts[c.type]++);
  const byProject = {};
  changes.forEach(c => { byProject[c.project] = (byProject[c.project] || 0) + 1; });
  const mostActive = Object.keys(byProject).sort((a,b) => byProject[b] - byProject[a])[0];
  const activeGoals = new Set(changes.map(c => c.goalId)).size;
  return { w, changes, risks, quiet, counts,
    activeGoals, totalGoals: state.goals.length, mostActive, mostActiveCount: mostActive ? byProject[mostActive] : 0 };
}

function wkDayLabel(ts, weekStartTs){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d) / DAY);
  const wd = '周' + '日一二三四五六'[d.getDay()];
  if (diff === 0) return '今天 · ' + wd;
  if (diff === 1) return '昨天 · ' + wd;
  return wd + ' ' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function renderWeekly(){
  const data = deriveWeekly(weekOffset);
  const wk = $('#weekly');
  const TYPE = {
    done:    { label:'完成', icon:'✓' },
    progress:{ label:'进展', icon:'●' },
    add:     { label:'新增', icon:'＋' },
    status:  { label:'状态', icon:'↻' },
  };
  const statPill = (type, label, n) =>
    '<span class="wk-stat' + (wkType === type ? ' on' : '') + '" data-wk-type="' + type + '">' +
    (type !== 'all' ? '<span class="dot" style="background:' + ({done:'var(--green)',progress:'var(--accent)',add:'var(--blue)',status:'var(--amber)'})[type] + '"></span>' : '') +
    label + ' <b>' + n + '</b></span>';

  let html =
    '<div class="wk-head">' +
      '<span class="wk-title">' + (weekOffset === 0 ? '本周' : '上周') + '回顾</span>' +
      '<span class="wk-range">' + data.w.label + '</span>' +
      '<span class="wk-week-switch">' +
        '<button data-wk-week="0"' + (weekOffset === 0 ? ' class="on"' : '') + '>本周</button>' +
        '<button data-wk-week="-1"' + (weekOffset === -1 ? ' class="on"' : '') + '>上周</button>' +
      '</span>' +
    '</div>' +
    '<div class="wk-note-tip">💡 按<b>自然周</b>回顾当前沙盘：这里展示这段时间里发生了什么、什么卡住了、什么在沉睡。数据由沙盘自动推导，也可以顺手补一句进展、调整状态。</div>' +
    '<div class="wk-sec">速览</div>' +
    '<div class="wk-stats">' +
      statPill('all', '全部变化', data.changes.length) +
      statPill('done', '完成', data.counts.done) +
      statPill('progress', '进展', data.counts.progress) +
      statPill('add', '新增', data.counts.add) +
      statPill('status', '状态变化', data.counts.status) +
    '</div>' +
    '<div class="wk-summary">' + weeklySummaryText(data) + '</div>' +
    '<div class="wk-sec">需要关注</div>' +
    (data.risks.length ? data.risks.map(r =>
      '<div class="wk-risk ' + (r.level === 'amber' ? 'amber' : '') + '">' +
        '<span class="r-icon">' + (r.level === 'red' ? '🔥' : '⏳') + '</span>' +
        '<div class="r-body">' +
          '<div class="r-title">' + esc(r.title) + '</div>' +
          '<div class="r-desc">' + esc(r.desc) + '</div>' +
          '<div class="r-acts">' +
            (r.level === 'red' ? '<button class="wk-btn" data-wk="status" data-pid="' + r.pid + '" data-status="on-track">改为进行中</button>' : '') +
            (r.tag.indexOf('逾期') === 0 ? '<button class="wk-btn" data-wk="snooze" data-pid="' + r.pid + '">顺延一周</button>' : '') +
          '</div>' +
        '</div>' +
        '<span class="r-tag">' + r.tag + '</span>' +
      '</div>').join('') : '<div class="wk-empty">暂无受阻或逾期，保持住 ✨</div>') +
    '<div class="wk-sec">本周变化<span class="wk-sec-range">' + data.w.label + '</span></div>' +
    '<div class="wk-stats" style="margin-bottom:12px">' +
      statPill('all', '全部', data.changes.length) +
      statPill('done', '完成', data.counts.done) +
      statPill('progress', '进展', data.counts.progress) +
      statPill('add', '新增', data.counts.add) +
      statPill('status', '状态', data.counts.status) +
    '</div>';

  const visible = data.changes.filter(c => wkType === 'all' || c.type === wkType);
  if (!visible.length){
    html += '<div class="wk-empty">' + (data.changes.length ? '该类型下没有变化' : '这一周还没有变化，去沙盘里推进一下吧') + '</div>';
  } else {
    const days = [...new Set(visible.map(c => {
      const d = new Date(c.ts); d.setHours(0,0,0,0); return d.getTime();
    }))].sort((a,b) => b - a);
    days.forEach(dayTs => {
      html += '<div class="wk-day">' + wkDayLabel(dayTs, data.w.start) + '</div>';
      state.goals.forEach(g => {
        const gItems = visible.filter(c => {
          const d = new Date(c.ts); d.setHours(0,0,0,0);
          return d.getTime() === dayTs && c.goalId === g.id;
        });
        if (!gItems.length) return;
        html += '<div class="wk-goal"><div class="wk-goal-head"><span class="dot" style="background:' + g.color + '"></span><b>' + esc(g.name) + '</b></div>' +
          gItems.map(c => {
            const m = TYPE[c.type];
            return '<div class="wk-item">' +
              '<span class="c-icon ' + c.type + '">' + m.icon + '</span>' +
              '<div class="c-body">' +
                '<div class="c-project">' + esc(c.project) + '</div>' +
                '<div class="c-text">' + (c.issue ? '<span class="issue">' + esc(c.issue) + '</span>：' : '') + esc(c.text) + '</div>' +
                (c.issueId ? '<form class="wk-note-form" data-issue="' + c.issueId + '"><input placeholder="补一句进展，回车保存" maxlength="200"><button type="submit">保存</button></form>' : '') +
              '</div>' +
              '<span class="c-side">' +
                '<span class="c-time">' + fmtHist(c.ts) + '</span>' +
                (c.issueId ? '<button class="c-add" data-wk="note-open" data-issue="' + c.issueId + '">补一句</button>' : '') +
              '</span>' +
            '</div>';
          }).join('') + '</div>';
      });
    });
  }

  html += '<div class="wk-sec">本周没有动静</div>' +
    (data.quiet.length ? data.quiet.map(q =>
      '<div class="wk-quiet">' +
        '<span>💤</span>' +
        '<div class="q-body"><div class="q-name">' + esc(q.name) + '</div><div class="q-goal">' + esc(q.goal) + '</div></div>' +
        '<span class="q-days">' + q.days + ' 天没有更新</span>' +
        '<span class="q-acts">' +
          (q.days >= 3 ? '<button class="wk-btn" data-wk="snooze" data-pid="' + q.pid + '">设个期限</button>' : '') +
          '<button class="wk-btn" data-wk="status" data-pid="' + q.pid + '" data-status="paused">暂停</button>' +
        '</span>' +
      '</div>').join('') : '<div class="wk-empty">所有项目本周都有动静 👍</div>');

  html += '<div class="wk-sec">周报</div>' +
    '<div class="wk-report">' +
      '<div class="wk-report-head"><span>已按' + (weekOffset === 0 ? '本周' : '上周') + '变化自动生成，可直接粘贴</span>' +
      '<button data-wk="copy-report">复制周报</button></div>' +
      '<div class="wk-report-body">' + esc(buildWeeklyReport(data)) + '</div>' +
    '</div>';

  wk.innerHTML = html;
}

function weeklySummaryText(data){
  if (!data.changes.length){
    const q = data.quiet[0];
    return '这一周还没有记录到变化。' + (q ? '值得警惕的是：<b>' + esc(q.name) + '</b> 已 ' + q.days + ' 天没有动静。' : '');
  }
  let t = data.totalGoals + ' 个目标里 <b>' + data.activeGoals + '</b> 个有推进';
  if (data.mostActive) t += '；<b>' + esc(data.mostActive) + '</b> 最活跃（' + data.mostActiveCount + ' 条变化）';
  if (data.quiet.length) t += '。值得警惕的是：<b>' + esc(data.quiet[0].name) + '</b> 已 ' + data.quiet[0].days + ' 天没有动静';
  return t + '。';
}

function buildWeeklyReport(data){
  const lines = ['📌 项目周报（' + data.w.label + '）', ''];
  state.goals.forEach(g => {
    const items = data.changes.filter(c => c.goalId === g.id);
    if (!items.length) return;
    lines.push('【' + g.name + '】');
    items.forEach(c => {
      const prefix = c.type === 'done' ? '✅ ' : c.type === 'add' ? '➕ ' : c.type === 'status' ? '🔁 ' : '· ';
      lines.push(prefix + (c.issue ? c.issue + '：' : '') + c.text);
    });
    lines.push('');
  });
  if (data.risks.length){
    lines.push('⚠️ 需要关注');
    data.risks.forEach(r => lines.push(r.tag + '：' + r.title + ' — ' + (r.desc.split('· ')[1] || r.desc)));
    lines.push('');
  }
  if (data.quiet.length){
    lines.push('💤 无动静：' + data.quiet.map(q => q.name + '（' + q.days + ' 天）').join('、'));
  }
  return lines.join('\n').trim();
}

/* 周视图内的轻操作与筛选（事件委托，容器只绑一次） */
$('#weekly').addEventListener('click', e => {
  const weekBtn = e.target.closest('[data-wk-week]');
  if (weekBtn){ weekOffset = Number(weekBtn.dataset.wkWeek); renderWeekly(); return; }
  const typeBtn = e.target.closest('[data-wk-type]');
  if (typeBtn){ wkType = typeBtn.dataset.wkType; renderWeekly(); return; }
  const openBtn = e.target.closest('[data-wk="note-open"]');
  if (openBtn){
    const item = openBtn.closest('.wk-item');
    const form = item && item.querySelector('.wk-note-form');
    document.querySelectorAll('.wk-note-form.open').forEach(f => { if (f !== form) f.classList.remove('open'); });
    if (form){
      form.classList.toggle('open');
      if (form.classList.contains('open')){ const inp = form.querySelector('input'); inp.focus(); }
    }
    return;
  }
  const act = e.target.closest('[data-wk]');
  if (!act) return;
  const kind = act.dataset.wk, pid = act.dataset.pid;
  if (kind === 'status'){
    const p = state.projects.find(x => x.id === pid);
    if (p){ setStatus(p, act.dataset.status); p.updatedAt = Date.now(); save(); renderWeekly(); toast('「' + p.name + '」状态已调整'); }
  } else if (kind === 'snooze'){
    const p = state.projects.find(x => x.id === pid);
    if (p){
      const base = (p.deadline && p.deadline > todayStr()) ? new Date(p.deadline + 'T00:00:00') : new Date();
      base.setDate(base.getDate() + 7);
      p.deadline = todayStrOf(base);
      p.updatedAt = Date.now();
      save(); renderWeekly();
      toast('「' + p.name + '」截止顺延至 ' + fmtDeadline(p.deadline));
    }
  } else if (kind === 'copy-report'){
    const text = $('#weekly .wk-report-body').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => toast('周报已复制，直接去粘贴吧'))
      .catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        toast('周报已复制');
      });
  }
});
$('#weekly').addEventListener('submit', e => {
  if (!e.target.classList.contains('wk-note-form')) return;
  e.preventDefault();
  const form = e.target;
  const issue = state.issues.find(i => i.id === form.dataset.issue);
  const val = form.querySelector('input').value.trim();
  if (!issue || !val) return;
  if (!Array.isArray(issue.notes)) issue.notes = [];
  issue.notes.push({ ts: Date.now(), text: val });
  const pp = state.projects.find(x => x.id === issue.projectId);
  if (pp) pp.updatedAt = Date.now();
  save(); renderWeekly();
  toast('进展已记录');
});
document.querySelectorAll('#view-switch button').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));

function todayStrOf(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ================= 初始化 ================= */
async function bootLoad(){
  serverMode = await detectServer();
  if (serverMode){
    currentUser = await fetchMe();
    renderUserCtl();
    if (currentUser){
      await loadFromServer();
    } else {
      state = EMPTY_STATE();
      openAuth('login');
    }
  } else {
    loadLocal();
  }
}

    const item = e.target.closest('.board-item');

    closeBoardMenu();
    switchBoard(item.dataset.boardId);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#board-ctl')) closeBoardMenu();
  });
  $('#a-submit').addEventListener('click', authSubmit);
  $('#a-send').addEventListener('click', sendCode);
  document.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => setAuthMode(t.dataset.authTab)));
  // 登录弹窗内回车提交（输入法组合期间不响应）
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (!$('#auth-modal').classList.contains('open')) return;
    if (['a-email','a-pass','a-code'].includes(e.target.id)){
      e.preventDefault();
      authSubmit();
    }
  });
  bootLoad().then(() => {
    updateBackupUI();
    initBackup();
    renderAll();
    if (corruptDetected) toast('检测到已存数据损坏，坏数据已隔离保留在本地；当前展示的是全新示例数据', 'err');
    if (!serverMode && !window.showSaveFilePicker){
      let last = 0;
      try { last = Number(localStorage.getItem('psb-last-export')) || 0; } catch(e){}
      if (Date.now() - last > 7 * DAY) setTimeout(() => toast('已经超过一周没有导出备份了，建议点「导出」把数据存一份到磁盘'), 1500);
    }
  });
})();
